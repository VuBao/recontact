<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard CV</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#17233c;font:15px Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px}.header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.header h1{font-size:28px;margin:0 0 6px}.muted{color:#667085}.upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:#0f7b70;color:#fff;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.button:disabled{opacity:.55;cursor:wait}.file-input{position:absolute;inline-size:1px;block-size:1px;opacity:0}.search{width:280px;max-width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:10px 12px;font:inherit;background:#fff}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px}.filter-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.filter-select{max-width:180px;border:1px solid #d0d5dd;border-radius:9px;padding:10px;font:inherit;background:#fff;color:#344054}.upload-note{white-space:nowrap}.status{min-height:20px;margin:10px 2px;color:#667085}.status.error{color:#b42318}.status.ok{color:#067647}.table-wrap{overflow-x:hidden;background:#fff;border:1px solid #e2e8f0;border-radius:14px}table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:0}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #eef2f6;vertical-align:middle;overflow-wrap:anywhere}th{background:#f8fafc;color:#475467;font-size:15px;text-align:center}.stt-col{width:5%}.name-col{width:22%}th:nth-child(3){width:6%}th:nth-child(4){width:11%}th:nth-child(5){width:24%}th:nth-child(6){width:12%}th:nth-child(7){width:11%}th:nth-child(8){width:9%}td.stt{text-align:center;color:#667085;font-weight:700}tbody tr:last-child td{border-bottom:0}.name{font-weight:700}.name-katakana{font-size:13px;font-weight:600;margin-bottom:3px}.name-romaji{font-size:15px;white-space:nowrap}.empty{text-align:center;color:#667085;padding:44px!important}.cv-link{color:#0f7b70;font-weight:700;text-decoration:none}.cv-link:hover{text-decoration:underline}@media(max-width:720px){.wrap{padding:18px 12px}.header{align-items:stretch;flex-direction:column}.header .button{width:100%}.bar{align-items:stretch;flex-direction:column}.filter-controls{display:grid;grid-template-columns:1fr 1fr}.search{width:100%;grid-column:1/-1}.filter-select{width:100%;max-width:none}.upload-note{white-space:normal}.table-wrap{overflow:visible;border:0;background:transparent}table{min-width:0}thead{display:none}tbody{display:grid;gap:12px}tbody tr{display:block;background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}tbody td{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;width:100%;padding:10px 12px;border-bottom:1px solid #eef2f6;overflow-wrap:anywhere}tbody td::before{content:attr(data-label);font-weight:700;color:#667085}tbody td.name{display:block;padding:14px 12px;background:#f8fafc}.name::before,.empty::before{display:none}tbody td:last-child{border-bottom:0}.empty{display:block!important}}@media(max-width:430px){.filter-controls{grid-template-columns:1fr}}
    .column-header{display:flex;align-items:center;justify-content:center;gap:2px}.filter-trigger{flex:0 0 16px;width:16px;height:20px;padding:0;border:0;background:transparent;color:#667085;cursor:pointer;font-size:12px}.filter-trigger.active{color:#0f7b70;font-weight:900}.filter-menu{position:fixed;z-index:20;width:280px;max-height:460px;padding:10px;background:#fff;border:1px solid #d0d5dd;border-radius:10px;box-shadow:0 12px 30px #1018282b;color:#344054}.filter-menu[hidden]{display:none}.filter-menu-title{font-weight:700;margin:2px 2px 8px}.filter-menu-action{display:block;width:100%;padding:8px;border:0;border-radius:6px;background:transparent;text-align:left;font:inherit;cursor:pointer}.filter-menu-action:hover{background:#f2f4f7}.filter-menu-tools{display:flex;justify-content:space-between;gap:8px;margin:8px 2px}.filter-menu-tools button{border:0;background:transparent;color:#0f7b70;padding:0;cursor:pointer}.filter-menu-search{width:100%;padding:8px 10px;border:1px solid #d0d5dd;border-radius:7px;font:inherit}.filter-options{max-height:230px;overflow-y:auto;margin:8px 0}.filter-option{display:flex;align-items:flex-start;gap:8px;padding:6px 4px;cursor:pointer;overflow-wrap:anywhere}.filter-option input{margin-top:2px}.filter-menu-footer{display:flex;justify-content:flex-end;gap:8px;padding-top:8px;border-top:1px solid #eaecf0}.filter-menu-footer button{border:1px solid #d0d5dd;border-radius:7px;background:#fff;padding:8px 14px;font:inherit;cursor:pointer}.filter-menu-footer .apply-filter{border-color:#0f7b70;background:#0f7b70;color:#fff}@media(min-width:721px){.filter-select{display:none}}@media(max-width:720px){.filter-menu{left:12px!important;right:12px;width:auto;max-height:70vh}}
    .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 2px}.pager[hidden]{display:none}.pager-info{color:#667085}.pager-buttons{display:flex;gap:6px;flex-wrap:wrap}.pager-button{min-width:36px;height:36px;padding:0 10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;color:#344054;font:inherit;cursor:pointer}.pager-button.current{background:#0f7b70;border-color:#0f7b70;color:#fff;font-weight:700}.pager-button:disabled{opacity:.45;cursor:default}.pager-gap{align-self:center;color:#667085}@media(max-width:720px){.pager{justify-content:center}}
  </style>
</head>
<body>
<main id="dashboard" class="wrap">
  <header class="header">
    <div><h1>DASHBOARD</h1><div id="count" class="muted">0 hồ sơ</div></div>
    <div class="upload">
      <input id="files" class="file-input" type="file" accept="application/pdf,.pdf" multiple>
      <label for="files" class="button">＋ Thêm CV</label>
    </div>
  </header>

  <section class="bar">
    <div class="filter-controls">
      <input id="search" class="search" placeholder="Tìm theo tên, SĐT hoặc email">
      <select id="visa-filter" class="filter-select" aria-label="Lọc theo visa"><option value="">Visa: Tất cả</option></select>
      <select id="japanese-filter" class="filter-select" aria-label="Lọc theo tiếng Nhật"><option value="">Tiếng Nhật: Tất cả</option></select>
    </div>
    <span class="muted upload-note">Chỉ nhận hồ sơ PDF, tối đa 15 MB/file.</span>
  </section>
  <p id="status" class="status"></p>

  <div class="table-wrap">
    <table>
      <thead><tr><th class="stt-col">STT</th><th class="name-col">Tên</th><th>Tuổi</th><th>SĐT</th><th>Mail</th><th><div class="column-header"><span>Visa hiện tại</span><button class="filter-trigger" data-filter="current_visa" aria-label="Lọc Visa hiện tại">▼</button></div></th><th><div class="column-header"><span>Tiếng Nhật</span><button class="filter-trigger" data-filter="japanese_level" aria-label="Lọc Tiếng Nhật">▼</button></div></th><th>Hồ sơ</th></tr></thead>
      <tbody id="candidate-list"><tr><td colspan="8" class="empty">Chưa có hồ sơ.</td></tr></tbody>
    </table>
  </div>
  <nav id="pager" class="pager" aria-label="Phân trang" hidden></nav>
  <div id="filter-menu" class="filter-menu" hidden>
    <div id="filter-menu-title" class="filter-menu-title"></div>
    <button class="filter-menu-action" data-menu-sort="1">Sắp xếp A → Z</button>
    <button class="filter-menu-action" data-menu-sort="-1">Sắp xếp Z → A</button>
    <div class="filter-menu-tools"><button id="filter-all" type="button">Chọn tất cả</button><button id="filter-clear" type="button">Xóa</button></div>
    <input id="filter-value-search" class="filter-menu-search" placeholder="Tìm giá trị" aria-label="Tìm giá trị lọc">
    <div id="filter-options" class="filter-options"></div>
    <div class="filter-menu-footer"><button id="filter-cancel" type="button">Hủy</button><button id="filter-apply" class="apply-filter" type="button">OK</button></div>
  </div>
</main>

<script>
let candidates=[],sortKey='',sortDirection=1,activeFilters=new Map(),menuKey='',menuSelection=new Set(),page=1;

// <list-view>
const PAGE_SIZE=10;
function japaneseRank(value){const match=String(value||'').match(/\bN([1-5])\b/i);return match?Number(match[1]):99}
function compareByJapaneseLevel(a,b){return japaneseRank(a.japanese_level)-japaneseRank(b.japanese_level)}
function paginate(items,page,size=PAGE_SIZE){
  const pages=Math.max(1,Math.ceil(items.length/size)),current=Math.min(Math.max(1,Number(page)||1),pages),offset=(current-1)*size;
  return {page:current,pages,offset,items:items.slice(offset,offset+size)};
}
function pageNumbers(page,pages){
  if(pages<=7)return Array.from({length:pages},(_,index)=>index+1);
  const list=[...new Set([1,pages,page-1,page,page+1])].filter(number=>number>=1&&number<=pages).sort((a,b)=>a-b),result=[];
  list.forEach((number,index)=>{if(index&&number-list[index-1]>1)result.push('…');result.push(number)});
  return result;
}
// </list-view>

function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
function setStatus(message,type=''){const element=document.querySelector('#status');element.textContent=message;element.className='status '+type}
function spaceKatakana(value,romaji){
  const groups=String(value||'').trim().split(/\s+/).filter(Boolean),parts=String(romaji||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length<2||groups.length>=parts.length)return groups.join(' ');
  const chars=[...groups.join('')],weights=parts.map(part=>Math.max(1,part.replace(/[^A-Za-z]/g,'').length)),total=weights.reduce((sum,weight)=>sum+weight,0);
  let start=0,cumulative=0;
  return weights.map((weight,index)=>{cumulative+=weight;const remaining=weights.length-index-1;const end=index===weights.length-1?chars.length:Math.max(start+1,Math.min(chars.length-remaining,Math.round(chars.length*cumulative/total)));const result=chars.slice(start,end).join('');start=end;return result}).filter(Boolean).join(' ');
}
function splitName(value){
  const original=String(value||'').trim(),katakana=[];
  const cleaned=original.replace(/[（(]([^）)]+)[）)]/g,(whole,inside)=>{
    const text=inside.trim();
    if(/^(?:履歴書なし|写真なし|顔写真なし|CVなし)$/i.test(text))return ' ';
    if(/^[\u30a0-\u30ff\u31f0-\u31ffー・\s]+$/.test(text)){katakana.push(text);return ' '}
    return whole;
  }).replace(/\s+/g,' ').trim();
  const hasLatin=/[A-Za-z]/.test(cleaned),hasJapanese=/[\u3040-\u30ff\u31f0-\u31ff\u3400-\u9fff]/.test(cleaned);
  if(!hasLatin&&hasJapanese&&cleaned)katakana.unshift(cleaned);
  const romaji=hasLatin?cleaned:(!hasJapanese?cleaned:'');
  return {katakana:spaceKatakana(katakana.join(' '),romaji),romaji};
}
function compareCandidates(a,b){
  const left=a[sortKey],right=b[sortKey];
  if(left==null||left==='')return right==null||right===''?0:1;
  if(right==null||right==='')return -1;
  if(sortKey==='age')return (Number(left)-Number(right))*sortDirection;
  return String(left).localeCompare(String(right),'vi',{numeric:true,sensitivity:'base'})*sortDirection;
}
function japaneseValue(value){
  const text=String(value||'').trim(),level=text.match(/\bN[1-5]\b/i);
  return level?level[0].toUpperCase():text;
}
function fillFilter(selector,key,label,normalize=value=>String(value||'').trim()){
  const select=document.querySelector(selector),current=select.value;
  const values=[...new Set(candidates.map(item=>normalize(item[key])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi',{numeric:true,sensitivity:'base'}));
  select.replaceChildren(new Option(`${label}: Tất cả`,''),new Option(`${label}: Chưa có`,'__empty__'),...values.map(value=>new Option(value,value)));
  if([...select.options].some(option=>option.value===current))select.value=current;
}
function refreshFilters(){
  fillFilter('#visa-filter','current_visa','Visa');
  fillFilter('#japanese-filter','japanese_level','Tiếng Nhật',japaneseValue);
}
function fitRomajiNames(){
  document.querySelectorAll('.name-romaji').forEach(element=>{
    element.style.fontSize='';
    if(matchMedia('(max-width:720px)').matches)return;
    let size=15;
    while(element.scrollWidth>element.clientWidth&&size>9){size-=.5;element.style.fontSize=`${size}px`}
  });
}
const columnLabels={current_visa:'Visa hiện tại',japanese_level:'Tiếng Nhật'};
function columnValue(item,key){
  if(key==='japanese_level')return japaneseValue(item[key])||'__empty__';
  return String(item[key]??'').trim()||'__empty__';
}
function columnValues(key){return [...new Set(candidates.map(item=>columnValue(item,key)))].sort((a,b)=>a==='__empty__'?1:b==='__empty__'?-1:a.localeCompare(b,'vi',{numeric:true,sensitivity:'base'}))}
function valueLabel(value){return value==='__empty__'?'(Trống)':value}
function renderFilterOptions(){
  const query=document.querySelector('#filter-value-search').value.trim().toLowerCase(),container=document.querySelector('#filter-options');
  container.replaceChildren(...columnValues(menuKey).filter(value=>valueLabel(value).toLowerCase().includes(query)).map(value=>{
    const label=document.createElement('label'),input=document.createElement('input'),text=document.createElement('span');
    label.className='filter-option';input.type='checkbox';input.checked=menuSelection.has(value);text.textContent=valueLabel(value);
    input.addEventListener('change',()=>input.checked?menuSelection.add(value):menuSelection.delete(value));
    label.append(input,text);return label;
  }));
}
function closeFilterMenu(){document.querySelector('#filter-menu').hidden=true;menuKey=''}
function openFilterMenu(button){
  menuKey=button.dataset.filter;const values=columnValues(menuKey),active=activeFilters.get(menuKey);
  menuSelection=new Set(active||values);document.querySelector('#filter-menu-title').textContent=`Lọc ${columnLabels[menuKey]}`;
  document.querySelector('#filter-value-search').value='';renderFilterOptions();
  const menu=document.querySelector('#filter-menu'),rect=button.getBoundingClientRect();menu.hidden=false;
  menu.style.left=`${Math.max(8,Math.min(rect.left,innerWidth-menu.offsetWidth-8))}px`;menu.style.top=`${Math.max(8,Math.min(rect.bottom+6,innerHeight-menu.offsetHeight-8))}px`;
}

async function api(path,options={}){
  const headers={...(options.headers||{})};
  if(options.body&&!(options.body instanceof FormData))headers['Content-Type']='application/json';
  const response=await fetch(path,{...options,headers,credentials:'same-origin'});
  const contentType=response.headers.get('content-type')||'';
  const result=contentType.includes('application/json')?await response.json():await response.text();
  if(response.status===401)throw new Error('Phiên Cloudflare Access không hợp lệ. Hãy tải lại trang để đăng nhập.')
  if(!response.ok){
    if(typeof result==='string'&&result.trim().startsWith('<')&&['127.0.0.1','localhost'].includes(location.hostname)){
      const error=new Error('');error.silent=true;throw error;
    }
    throw new Error(typeof result==='string'?result:(result.error||'Không thể thực hiện thao tác.'));
  }
  return result;
}

async function loadCandidates(){
  try{candidates=await api('/api/candidates');refreshFilters();setStatus('');render()}
  catch(error){setStatus(error.silent?'':error.message,error.silent?'':'error')}
}

function render(){
  const query=document.querySelector('#search').value.trim().toLowerCase();
  const visa=document.querySelector('#visa-filter').value,japanese=document.querySelector('#japanese-filter').value;
  const matches=(selected,value)=>!selected||(selected==='__empty__'?!value:value===selected);
  const visible=candidates.filter(item=>`${item.full_name||''} ${item.phone||''} ${item.email||''}`.toLowerCase().includes(query)&&matches(visa,String(item.current_visa||'').trim())&&matches(japanese,japaneseValue(item.japanese_level))&&[...activeFilters].every(([key,values])=>values.has(columnValue(item,key))));
  visible.sort(sortKey?compareCandidates:compareByJapaneseLevel);
  const view=paginate(visible,page);page=view.page;
  document.querySelector('#count').textContent=`${visible.length}/${candidates.length} hồ sơ`;
  document.querySelectorAll('.filter-trigger').forEach(button=>button.classList.toggle('active',activeFilters.has(button.dataset.filter)));
  document.querySelector('#candidate-list').innerHTML=visible.length?view.items.map((item,index)=>{const name=splitName(item.full_name);return `<tr><td class="stt" data-label="STT">${view.offset+index+1}</td><td class="name" data-label="Tên">${name.katakana?`<div class="name-katakana">${escapeHtml(name.katakana)}</div>`:''}${name.romaji?`<div class="name-romaji">${escapeHtml(name.romaji)}</div>`:(!name.katakana?'—':'')}</td><td data-label="Tuổi">${escapeHtml(item.age??'—')}</td><td data-label="SĐT">${escapeHtml(item.phone||'—')}</td><td data-label="Mail">${escapeHtml(item.email||'—')}</td><td data-label="Visa hiện tại">${escapeHtml(item.current_visa||'—')}</td><td data-label="Tiếng Nhật">${escapeHtml(item.japanese_level||'—')}</td><td data-label="Hồ sơ">${item.file_name?`<a class="cv-link" href="/api/cv?id=${encodeURIComponent(item.id)}" target="_blank" rel="noopener">Mở PDF</a>`:'—'}</td></tr>`}).join(''):'<tr><td colspan="8" class="empty">Không có hồ sơ phù hợp.</td></tr>';
  renderPager(view,visible.length);
  fitRomajiNames();
}

function renderPager(view,total){
  const pager=document.querySelector('#pager');
  if(total<=PAGE_SIZE){pager.hidden=true;pager.replaceChildren();return}
  pager.hidden=false;
  const info=document.createElement('span'),buttons=document.createElement('div');
  info.className='pager-info';info.textContent=`Hiển thị ${view.offset+1}–${view.offset+view.items.length} / ${total} hồ sơ`;buttons.className='pager-buttons';
  const button=(label,target,{current=false,disabled=false,aria=''}={})=>{
    const element=document.createElement('button');element.type='button';element.className='pager-button'+(current?' current':'');element.textContent=label;element.disabled=disabled;
    if(aria)element.setAttribute('aria-label',aria);if(current)element.setAttribute('aria-current','page');
    element.addEventListener('click',()=>{page=target;render()});return element;
  };
  const gap=()=>{const element=document.createElement('span');element.className='pager-gap';element.textContent='…';return element};
  buttons.append(button('‹',view.page-1,{disabled:view.page===1,aria:'Trang trước'}),...pageNumbers(view.page,view.pages).map(number=>number==='…'?gap():button(String(number),number,{current:number===view.page})),button('›',view.page+1,{disabled:view.page===view.pages,aria:'Trang sau'}));
  pager.replaceChildren(info,buttons);
}

async function uploadFiles(files){
  const pdfs=[...files].filter(file=>/\.pdf$/i.test(file.name));
  if(!pdfs.length){setStatus('Vui lòng chọn file PDF.','error');return}
  let completed=0,failed=0;
  for(const file of pdfs){
    setStatus(`Đang đọc ${completed+failed+1}/${pdfs.length}: ${file.name}`);
    try{const form=new FormData();form.append('file',file);await api('/api/import',{method:'POST',body:form});completed++}
    catch(error){failed++;setStatus(`${file.name}: ${error.message}`,'error')}
  }
  await loadCandidates();
  setStatus(`Hoàn tất ${completed} hồ sơ${failed?`, ${failed} hồ sơ lỗi`:''}.`,failed?'error':'ok');
  document.querySelector('#files').value='';
}

document.querySelector('#files').addEventListener('change',event=>uploadFiles(event.target.files));
document.querySelector('#search').addEventListener('input',()=>{page=1;render()});
document.querySelectorAll('.filter-select').forEach(select=>select.addEventListener('change',()=>{page=1;render()}));
document.querySelectorAll('.filter-trigger').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();openFilterMenu(button)}));
document.querySelector('#filter-value-search').addEventListener('input',renderFilterOptions);
document.querySelector('#filter-all').addEventListener('click',()=>{menuSelection=new Set(columnValues(menuKey));renderFilterOptions()});
document.querySelector('#filter-clear').addEventListener('click',()=>{menuSelection.clear();renderFilterOptions()});
document.querySelector('#filter-cancel').addEventListener('click',closeFilterMenu);
document.querySelector('#filter-apply').addEventListener('click',()=>{const values=columnValues(menuKey);if(menuSelection.size===values.length)activeFilters.delete(menuKey);else activeFilters.set(menuKey,new Set(menuSelection));closeFilterMenu();page=1;render()});
document.querySelectorAll('[data-menu-sort]').forEach(button=>button.addEventListener('click',()=>{sortKey=menuKey;sortDirection=Number(button.dataset.menuSort);closeFilterMenu();page=1;render()}));
document.addEventListener('click',event=>{const menu=document.querySelector('#filter-menu');if(!menu.hidden&&!menu.contains(event.target)&&!event.target.closest('.filter-trigger'))closeFilterMenu()});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeFilterMenu()});
window.addEventListener('resize',()=>{fitRomajiNames();closeFilterMenu()});
loadCandidates();
</script>
</body>
</html>
