:600;margin-bottom:3px}.name-romaji{font-size:15px;white-space:nowrap}.empty{text-align:center;color:#667085;padding:44px!important}.cv-link{color:#0f7b70;font-weight:700;text-decoration:none}.cv-link:hover{text-decoration:underline}@media(max-width:720px){.wrap{padding:18px 12px}.header{align-items:stretch;flex-direction:column}.header .button{width:100%}.bar{align-items:stretch;flex-direction:column}.filter-controls{display:grid;grid-template-columns:1fr 1fr}.search{width:100%;grid-column:1/-1}.filter-select{width:100%;max-width:none}.upload-note{white-space:normal}.table-wrap{overflow:visible;border:0;background:transparent}table{min-width:0}thead{display:none}tbody{display:grid;gap:12px}tbody tr{display:block;background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}tbody td{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;width:100%;padding:10px 12px;border-bottom:1px solid #eef2f6;overflow-wrap:anywhere}tbody td::before{content:attr(data-label);font-weight:700;color:#667085}tbody td.name{display:block;padding:14px 12px;background:#f8fafc}.name::before,.empty::before{display:none}tbody td:last-child{border-bottom:0}.empty{display:block!important}}@media(max-width:430px){.filter-controls{grid-template-columns:1fr}}

    .button[hidden]{display:none}.delete-button{background:#b42318}.select-col{width:4%}.stt-col{width:5%}th.name-col{width:20%}th:nth-child(4){width:6%}th:nth-child(5){width:10%}th:nth-child(6){width:23%}th:nth-child(7){width:12%}th:nth-child(8){width:11%}th:nth-child(9){width:9%}.select-cell{text-align:center}.select-cell input,.select-col input{width:17px;height:17px;cursor:pointer}.confirm-dialog{width:min(420px,calc(100% - 32px));padding:24px;border:0;border-radius:14px;box-shadow:0 18px 50px #10182840;color:#17233c}.confirm-dialog::backdrop{background:#10182880}.confirm-dialog p{margin:0 0 22px;font-size:17px;font-weight:700}.confirm-actions{display:flex;justify-content:flex-end;gap:10px}.confirm-actions button{border:1px solid #d0d5dd;border-radius:8px;background:#fff;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}.confirm-actions .confirm-delete{border-color:#b42318;background:#b42318;color:#fff}.pager{display:flex;align-items:center;justify-content:center;gap:6px;padding:16px 4px}.pager[hidden]{display:none}.page-button{min-width:38px;height:38px;padding:0 10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;color:#344054;font:inherit;font-weight:700;cursor:pointer}.page-button:hover:not(:disabled){border-color:#0f7b70;color:#0f7b70}.page-button.current{border-color:#0f7b70;background:#0f7b70;color:#fff}.page-button:disabled{opacity:.45;cursor:default}.page-gap{color:#667085;padding:0 2px}@media(max-width:720px){tbody td.select-cell{display:flex;justify-content:flex-end;padding:10px 12px 0;border-bottom:0;background:#f8fafc}.select-cell::before{display:none}.pager{flex-wrap:wrap}}
    .send-button{background:#175cd3}.role-input{width:210px}.mail-dialog{width:min(960px,calc(100% - 24px));max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);padding:0;border:0;border-radius:16px;box-shadow:0 18px 50px #10182840;color:#17233c;overflow:hidden}.mail-dialog::backdrop{background:#10182899}.mail-dialog-inner{display:flex;max-height:calc(100vh - 24px);flex-direction:column}.mail-dialog-header,.mail-dialog-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid #e4e7ec}.mail-dialog-actions{justify-content:flex-end;border-top:1px solid #e4e7ec;border-bottom:0}.mail-dialog-header h2{margin:0;font-size:22px}.icon-button{border:0;background:transparent;color:#667085;font-size:26px;line-height:1;cursor:pointer}.mail-dialog-body{padding:18px 20px;overflow-y:auto}.mail-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mail-field{display:grid;gap:6px;font-weight:700}.mail-field-wide{grid-column:1/-1}.mail-field input,.mail-field textarea{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:10px 12px;font:inherit;color:#17233c}.mail-field textarea{min-height:90px;resize:vertical}.mail-help{font-size:13px;font-weight:400;color:#667085}.mail-error{min-height:20px;margin:10px 0;color:#b42318}.mail-section-title{margin:18px 0 8px;font-size:16px}.mail-recipient-list{display:grid;border:1px solid #e4e7ec;border-radius:10px;overflow:hidden}.mail-recipient-row{display:grid;width:100%;grid-template-columns:1.2fr 1.5fr 1fr .7fr;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid #eef2f6;background:#fff;color:#17233c;text-align:left;font:inherit;align-items:center;overflow-wrap:anywhere}.mail-recipient-row[type=button]{cursor:pointer}.mail-recipient-row[type=button]:hover{background:#f8fafc}.mail-recipient-row:last-child{border-bottom:0}.mail-recipient-head{background:#f8fafc;color:#475467;font-weight:700}.mail-state-ready{color:#067647;font-weight:700}.mail-state-blocked{c <body>
<main id="dashboard" class="wrap">
  <header class="header">
    <div><h1>DASHBOARD</h1><div id="count" class="muted">0 hồ sơ</div></div>
    <div class="upload">
      <button id="send-selected" class="button send-button" type="button" hidden>Gửi mail (<span id="mail-selected-count">0</span>)</button>
      <button id="delete-selected" class="button delete-button" type="button" hidden>Xóa CV (<span id="selected-count">0</span>)</button>
      <input id="files" class="file-input" type="file" accept="application/pdf,.pdf" multiple>
      <label for="files" class="button">＋ Thêm CV</label>
    </div>
  </header>

  <section class="bar">
    <div class="filter-controls">
      <input id="search" class="search" placeholder="Tìm theo tên, SĐT hoặc email">
      <select id="upload-role" class="search role-input" aria-label="Phân loại vị trí cho CV tải lên" required><option value="">Chọn vị trí…</option></select>
      <input id="upload-role-new" class="search role-input" placeholder="Nhập tên vị trí mới" aria-label="Tên vị trí mới" hidden>
      <select id="visa-filter" class="filter-select" aria-label="Lọc theo visa"><option value="">Visa: Tất cả</option></select>
      <select id="japanese-filter" class="filter-select" aria-label="Lọc theo tiếng Nhật"><option value="">Tiếng Nhật: Tất cả</option></select>
    </div>
    <span class="muted upload-note">Chỉ nhận hồ sơ PDF, tối đa 15 MB/file.</span>
  </section>
  <p id="status" class="status"></p>

  <div class="table-wrap">
    <table>
      <thead><tr><th class="select-col"><input id="select-all" type="checkbox" aria-label="Chọn tất cả hồ sơ đang hiển thị"></th><th class="stt-col">STT</th><th class="name-col">Tên</th><th>Tuổi</th><th>SĐT</th><th>Mail</th><th><div class="column-header"><span>Visa hiện tại</span><button class="filter-trigger" data-filter="current_visa" aria-label="Lọc Visa hiện tại">▼</button></div></th><th><div class="column-header"><span>Tiếng Nhật</span><button class="filter-trigger" data-filter="japanese_level" aria-label="Lọc Tiếng Nhật">▼</button></div></th><th>Hồ sơ</th></tr></thead>
      <tbody id="candidate-list"><tr><td colspan="9" class="empty">Chưa có hồ sơ.</td></tr></tbody>
    </table>
  </div>
  <nav id="pager" class="pager" aria-label="Phân trang" hidden></nav>
  <div id="filter-menu" class="filter-menu" hidden>
    <div id="filter-menu-title" class="filter-menu-title"></div>
    <button class="filter-menu-action" data-menu-sort="1">Sắp xếp A → Z</button>
    <button class="filter-menu-action" data-menu-sort="-1">Sắp xếp Z → A</button>
    <div class="filter-menu-tools"><button id="filter-all" type="button">Chọn tất cả</button><button id="filter-clear" type="button">Xóa</button></div>
    <input id="filter-value-search" class="filter-menu-search" placeholder="Tìm giá trị" aria-label="Tìm giá trị lọc">
    <div id="filter-options" class="filter-options"></div>
    <div class="filter-menu-footer"><button id="filter-cancel" type="button">Hủy</button><button id="filter-apply" class="apply-filter" type="button">OK</button></div>
  </div>
  <dialog id="delete-dialog" class="confirm-dialog">
    <p>Có chắc chắn xoá CV này không ?</p>
    <div class="confirm-actions"><button id="delete-no" type="button">Không</button><button id="delete-yes" class="confirm-delete" type="button">Có</button></div>
  </dialog>
  <dialog id="mail-compose-dialog" class="mail-dialog" aria-labelledby="mail-dialog-title">
    <div class="mail-dialog-inner">
      <header class="mail-dialog-header">
        <div><h2 id="mail-dialog-title">Gửi mail cho ứng viên</h2><div id="mail-dialog-count" class="muted"></div></div>
        <button id="mail-close" class="icon-button" type="button" aria-label="Đóng cửa sổ gửi mail">×</button>
      </header>
      <div class="mail-dialog-body">
        <div class="mail-form-grid">
          <label class="mail-field">Tên công ty
            <input id="mail-company" autocomplete="organization" required placeholder="株式会社Be Furano">
          </label>
          <label class="mail-field">Tài liệu đính kèm
            <input id="mail-attachments" type="file" accept="application/pdf,.pdf" multiple>
            <span class="mail-help">Tối đa 3 PDF, 5 MB/file và 10 MB tổng. Không đính kèm CV.</span>
          </label>
          <label class="mail-field mail-field-wide">Nội dung theo công việc (có thể thay đổi)
            <textarea id="mail-job-paragraph" placeholder="Để trống để dùng nội dung cố định."></textarea>
            <span class="mail-help">Phần giới thiệu, câu hỏi phản hồi và lời kết được giữ cố định.</span>
          </label>
        </div>
        <ul id="mail-attachment-list" class="attachment-list" aria-live="polite"></ul>
        <div id="mail-validation" class="mail-error" role="alert"></div>
        <button id="mail-preview" class="button secondary-button" type="button">Tạo bản xem trước</button>

        <h3 class="mail-section-title">Người nhận</h3>
        <div id="mail-recipient-list" class="mail-recipient-list" aria-live="polite"></div>

        <section class="mail-preview" aria-labelledby="mail-preview-title">
          <div class="mail-preview-nav">
            <button id="mail-preview-previous" class="button secondary-button" type="button">← Trước</button>
            <strong id="mail-preview-title">Nội dung xem trước</strong>
            <button id="mail-preview-next" class="button secondary-button" type="button">Sau →</button>
          </div>
          <div id="mail-preview-subject" class="mail-preview-subject"></div>
          <pre id="mail-preview-body" class="mail-preview-body">Nhập tên công ty và tạo bản xem trước.</pre>
        </section>
        <p id="mail-result-summary" class="mail-result-summary" aria-live="polite"></p>
      </div>
      <footer class="mail-dialog-actions">
        <button id="mail-cancel" class="button secondary-button" type="button">Hủy</button>
        <button id="mail-send" class="button send-button" type="button" disabled>Gửi email</button>
      </footer>
    </div>
  </dialog>
  <dialog id="mail-confirm-dialog" class="confirm-dialog" aria-labelledby="mail-confirm-text">
    <p id="mail-confirm-text">Gửi email?</p>
    <div class="confirm-actions"><button id="mail-confirm-no" type="button">Hủy</button><button id="mail-confirm-yes" class="confirm-send" type="button">Gửi</button></div>
  </dialog>
  <footer style="padding:22px 0 4px;text-align:center"><a class="cv-link" href="/privacy.html">Privacy Policy</a></footer>
</main>

<script>
let candidates=[],sortKey='',sortDirection=1,activeFilters=new Map(),menuKey='',menuSelection=new Set(),selectedIds=new Set(),visibleIds=[],page=1,jobs=[];
let mailSelectedIds=[],mailPreviewItems=[],mailPreviewIndex=0,mailPreviewStale=true,mailSending=false,mailIdempotencyKey='',mailLastResult=null,mailTrigger=null;

// <list-view>
const PAGE_SIZE=10;
function japaneseRank(value){const match=String(value||'').match(/\bN([1-5])\b/i);return match?Number(match[1]):99}
function compareByJapaneseLevel(a,b){return japaneseRank(a.japanese_level)-japaneseRank(b.japanese_level)}
function paginate(items,currentPage,size=PAGE_SIZE){
  const pages=Math.max(1,Math.ceil(items.length/size)),numeric=Number(currentPage),safe=Number.isFinite(numeric)?Math.trunc(numeric):1;
  const selected=Math.min(pages,Math.max(1,safe)),offset=(selected-1)*size;
  return {page:selected,pages,offset,items:items.slice(offset,offset+size)};
}
function pageNumbers(currentPage,pages){
  if(pages<=7)return Array.from({length:pages},(_,index)=>index+1);
  const values=new Set([1,pages,currentPage-1,currentPage,currentPage+1].filter(value=>value>=1&&value<=pages)),result=[];
  [...values].sort((a,b)=>a-b).forEach(value=>{if(result.length&&value-result.at(-1)>1)result.push('…');result.push(value)});
  return result;
}
// </list-view>

// <mail-ui>
function selectedEligibleCount(items){return (items||[]).filter(item=>item.status==='READY').length}
function summarizeSendResult(result){
  const sent=Number(result?.sent||0),failed=Number(result?.failed||0);
  return failed?{message:`Đã gửi ${sent} email, ${failed} email thất bại.`,type:'error'}:{message:`Đã gửi thành công ${sent} email.`,type:'ok'};
}
// </mail-ui>

// <role-select>
function roleTitleKey(value){return String(value||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLowerCase()}
function matchJobByTitle(title){const key=roleTitleKey(title);return jobs.find(job=>roleTitleKey(job.title)===key)}
function renderJobOptions(){
  const select=document.querySelector('#upload-role'),current=select.value;
  const sorted=[...jobs].sort((a,b)=>a.title.localeCompare(b.title,'vi',{numeric:true,sensitivity:'base'}));
  select.replaceChildren(new Option('Chọn vị trí…',''),...sorted.map(job=>new Option(job.title,job.id)),new Option('+ Thêm vị trí mới…','__new__'));
  if([...select.options].some(option=>option.value===current))select.value=current;
}
async function loadJobs(){
  try{jobs=(await api('/api/jobs')).filter(job=>job.status==='OPEN')}catch{jobs=[]}
  renderJobOptions();
}
function selectedRoleTitle(){
  const select=document.querySelector('#upload-role');
  if(select.value==='__new__')return document.querySelector('#upload-role-new').value.trim();
  return jobs.find(job=>job.id===select.value)?.title||'';
}
function syncRoleSelection(title){
  const match=matchJobByTitle(title);
  document.querySelector('#upload-role').value=match?match.id:'';
  document.querySelector('#upload-role-new').hidden=true;
  document.querySelector('#upload-role-new').value='';
}
// </role-select>

function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
function setStatus(message,type=''){const element=document.querySelector('#status');element.textContent=message;element.className='status '+type}
function spaceKatakana(value,romaji){
  const groups=String(value||'').trim().split(/\s+/).filter(Boolean),parts=String(romaji||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length<2||groups.length>=parts.length)return groups.join(' ');
  const chars=[...groups.join('')],weights=parts.map(part=>Math.max(1,part.replace(/[^A-Za-z]/g,'').length)),total=weights.reduce((sum,weight)=>sum+weight,0);
  let start=0,cumulative=0;
  return weights.map((weight,index)=>{cumulative+=weight;const remaining=weights.length-index-1;const end=index===weights.length-1?chars.length:Math.max(start+1,Math.min(chars.length-remaining,Math.round(chars.length*cumulative/total)));const result=chars.slice(start,end).join('');start=end;return result}).filter(Boolean).join(' ');
}
function splitName(value){
  const original=String(value||'').trim(),katakana=[];
  const cleaned=original.replace(/[（(]([^）)]+)[）)]/g,(whole,inside)=>{
    const text=inside.trim();
    if(/^(?:履歴書なし|写真なし|顔写真なし|CVなし)$/i.test(text))return ' ';
    if(/^[\u30a0-\u30ff\u31f0-\u31ffー・\s]+$/.test(text)){katakana.push(text);return ' '}
    return whole;
  }).replace(/\s+/g,' ').trim();
  const hasLatin=/[A-Za-z]/.test(cleaned),hasJapanese=/[\u3040-\u30ff\u31f0-\u31ff\u3400-\u9fff]/.test(cleaned);
  if(!hasLatin&&hasJapanese&&cleaned)katakana.unshift(cleaned);
  const romaji=hasLatin?cleaned:(!hasJapanese?cleaned:'');
  return {katakana:spaceKatakana(katakana.join(' '),romaji),romaji};
}
function compareCandidates(a,b){
  const left=a[sortKey],right=b[sortKey];
  if(left==null||left==='')return right==null||right===''?0:1;
  if(right==null||right==='')return -1;
  if(sortKey==='age')return (Number(left)-Number(right))*sortDirection;
  return String(left).localeCompare(String(right),'vi',{numeric:true,sensitivity:'base'})*sortDirection;
}
function japaneseValue(value){
  const text=String(value||'').trim(),level=text.match(/\bN[1-5]\b/i);
  return level?level[0].toUpperCase():text;
}
function fillFilter(selector,key,label,normalize=value=>String(value||'').trim()){
  const select=document.querySelector(selector),current=select.value;
  const values=[...new Set(candidates.map(item=>normalize(item[key])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi',{numeric:true,sensitivity:'base'}));
  select.replaceChildren(new Option(`${label}: Tất cả`,''),new Option(`${label}: Chưa có`,'__empty__'),...values.map(value=>new Option(value,value)));
  if([...select.options].some(option=>option.value===current))select.value=current;
}
function refreshFilters(){
  fillFilter('#visa-filter','current_visa','Visa');
  fillFilter('#japanese-filter','japanese_level','Tiếng Nhật',japaneseValue);
}
function fitRomajiNames(){
  document.querySelectorAll('.name-romaji').forEach(element=>{
    element.style.fontSize='';
    if(matchMedia('(max-width:720px)').matches)return;
    let size=15;
    while(element.scrollWidth>element.clientWidth&&size>9){size-=.5;element.style.fontSize=`${size}px`}
  });
}
const columnLabels={current_visa:'Visa hiện tại',japanese_level:'Tiếng Nhật'};
function columnValue(item,key){
  if(key==='japanese_level')return japaneseValue(item[key])||'__empty__';
  return String(item[key]??'').trim()||'__empty__';
}
function columnValues(key){return [...new Set(candidates.map(item=>columnValue(item,key)))].sort((a,b)=>a==='__empty__'?1:b==='__empty__'?-1:a.localeCompare(b,'vi',{numeric:true,sensitivity:'base'}))}
function valueLabel(value){return value==='__empty__'?'(Trống)':value}
function renderFilterOptions(){
  const query=document.querySelector('#filter-value-search').value.trim().toLowerCase(),container=document.querySelector('#filter-options');
  container.replaceChildren(...columnValues(menuKey).filter(value=>valueLabel(value).toLowerCase().includes(query)).map(value=>{
    const label=document.createElement('label'),input=document.createElement('input'),text=document.createElement('span');
    label.className='filter-option';input.type='checkbox';input.checked=menuSelection.has(value);text.textContent=valueLabel(value);
    input.addEventListener('change',()=>input.checked?menuSelection.add(value):menuSelection.delete(value));
    label.append(input,text);return label;
  }));
}
function closeFilterMenu(){document.querySelector('#filter-menu').hidden=true;menuKey=''}
function openFilterMenu(button){
  menuKey=button.dataset.filter;const values=columnValues(menuKey),active=activeFilters.get(menuKey);
  menuSelection=new Set(active||values);document.querySelector('#filter-menu-title').textContent=`Lọc ${columnLabels[menuKey]}`;
  document.querySelector('#filter-value-search').value='';renderFilterOptions();
  const menu=document.querySelector('#filter-menu'),rect=button.getBoundingClientRect();menu.hidden=false;
  menu.style.left=`${Math.max(8,Math.min(rect.left,innerWidth-menu.offsetWidth-8))}px`;menu.style.top=`${Math.max(8,Math.min(rect.bottom+6,innerHeight-menu.offsetHeight-8))}px`;
}
function updateSelectionUI(){
  const count=selectedIds.size,button=document.querySelector('#delete-selected'),sendButton=document.querySelector('#send-selected'),selectAll=document.querySelector('#select-all');
  document.querySelector('#selected-count').textContent=count;document.querySelector('#mail-selected-count').textContent=count;button.hidden=count===0;sendButton.hidden=count===0;
  const selectedVisible=visibleIds.filter(id=>selectedIds.has(id)).length;
  selectAll.checked=visibleIds.length>0&&selectedVisible===visibleIds.length;
  selectAll.indeterminate=selectedVisible>0&&selectedVisible<visibleIds.length;
}

async function api(path,options={}){
  const headers={...(options.headers||{})};
  if(options.body&&!(options.body instanceof FormData))headers['Content-Type']='application/json';
  const response=await fetch(path,{...options,headers,credentials:'same-origin'});
  const contentType=response.headers.get('content-type')||'';
  const result=contentType.includes('application/json')?await response.json():await response.text();
  if(response.status===401)throw new Error('Phiên Cloudflare Access không hợp lệ. Hãy tải lại trang để đăng nhập.')
  if(!response.ok){
    if(typeof result==='string'&&result.trim().startsWith('<')&&['127.0.0.1','localhost'].includes(location.hostname)){
      const error=new Error('');error.silent=true;throw error;
    }
    throw new Error(typeof result==='string'?result:(result.error||'Không thể thực hiện thao tác.'));
  }
  return result;
}

async function loadCandidates(){
  try{candidates=await api('/api/candidates');selectedIds=new Set([...selectedIds].filter(id=>candidates.some(item=>item.id===id)));refreshFilters();setStatus('');render()}
  catch(error){setStatus(error.silent?'':error.message,error.silent?'':'error')}
}

function render(){
  const query=document.querySelector('#search').value.trim().toLowerCase();
  const visa=document.querySelector('#visa-filter').value,japanese=document.querySelector('#japanese-filter').value;
  const matches=(selected,value)=>!selected||(selected==='__empty__'?!value:value===selected);
  const visible=candidates.filter(item=>`${item.full_name||''} ${item.phone||''} ${item.email||''}`.toLowerCase().includes(query)&&matches(visa,String(item.current_visa||'').trim())&&matches(japanese,japaneseValue(item.japanese_level))&&[...activeFilters].every(([key,values])=>values.has(columnValue(item,key))));
  visible.sort(sortKey?compareCandidates:compareByJapaneseLevel);
  const view=paginate(visible,page);page=view.page;
  visibleIds=view.items.map(item=>item.id);
  document.querySelector('#count').textContent=`${visible.length}/${candidates.length} hồ sơ`;
  document.querySelectorAll('.filter-trigger').forEach(button=>button.classList.toggle('active',activeFilters.has(button.dataset.filter)));
  document.querySelector('#candidate-list').innerHTML=visible.length?view.items.map((item,index)=>{const name=splitName(item.full_name);return `<tr><td class="select-cell"><input class="row-select" type="checkbox" data-id="${escapeHtml(item.id)}" aria-label="Chọn ${escapeHtml(item.full_name||'hồ sơ')}" ${selectedIds.has(item.id)?'checked':''}></td><td class="stt" data-label="STT">${view.offset+index+1}</td><td class="name" data-label="Tên">${name.katakana?`<div class="name-katakana">${escapeHtml(name.katakana)}</div>`:''}${name.romaji?`<div class="name-romaji">${escapeHtml(name.romaji)}</div>`:(!name.katakana?'—':'')}</td><td data-label="Tuổi">${escapeHtml(item.age??'—')}</td><td data-label="SĐT">${escapeHtml(item.phone||'—')}</td><td data-label="Mail">${escapeHtml(item.email||'—')}</td><td data-label="Visa hiện tại">${escapeHtml(item.current_visa||'—')}</td><td data-label="Tiếng Nhật">${escapeHtml(item.japanese_level||'—')}</td><td data-label="Hồ sơ">${item.file_name?`<a class="cv-link" href="/api/cv?id=${encodeURIComponent(item.id)}" target="_blank" rel="noopener">Mở PDF</a>`:'—'}</td></tr>`}).join(''):'<tr><td colspan="9" class="empty">Không có hồ sơ phù hợp.</td></tr>';
  renderPager(view,visible.length);
  updateSelectionUI();
  fitRomajiNames();
}

function renderPager(view,total){
  const pager=document.querySelector('#pager');pager.hidden=total<=PAGE_SIZE;
  if(pager.hidden){pager.replaceChildren();return}
  const controls=[{label:'‹',target:view.page-1,disabled:view.page===1,aria:'Trang trước'},...pageNumbers(view.page,view.pages).map(value=>value==='…'?{gap:true,label:value}:{label:String(value),target:value,current:value===view.page,aria:`Trang ${value}`}),{label:'›',target:view.page+1,disabled:view.page===view.pages,aria:'Trang sau'}];
  pager.replaceChildren(...controls.map(control=>{
    if(control.gap){const gap=document.createElement('span');gap.className='page-gap';gap.textContent=control.label;return gap}
    const button=document.createElement('button');button.type='button';button.className=`page-button${control.current?' current':''}`;button.textContent=control.label;button.disabled=Boolean(control.disabled);button.setAttribute('aria-label',control.aria);if(control.current)button.setAttribute('aria-current','page');
    button.addEventListener('click',()=>{page=control.target;render();document.querySelector('.table-wrap').scrollIntoView({block:'start',behavior:'smooth'})});return button;
  }));
}

async function deleteSelectedCandidates(){
  if(!selectedIds.size)return;
  const confirmButton=document.querySelector('#delete-yes');confirmButton.disabled=true;
  try{
    const result=await api('/api/candidates',{method:'DELETE',body:JSON.stringify({ids:[...selectedIds]})});
    selectedIds.clear();document.querySelector('#delete-dialog').close();await loadCandidates();setStatus(`Đã xóa vĩnh viễn ${result.deleted} CV.`,'ok');
  }catch(error){document.querySelector('#delete-dialog').close();setStatus(error.message,'error')}
  finally{confirmButton.disabled=false}
}

const mailErrorLabels={
  EMAIL_MISSING:'Thiếu email',EMAIL_INVALID:'Email không hợp lệ',ROLE_MISSING:'Chưa có phân loại vị trí',ROLE_AMBIGUOUS:'Có nhiều phân loại vị trí',
  COMPANY_MISSING:'Thiếu tên công ty',ATTACHMENT_INVALID:'File đính kèm không hợp lệ',BATCH_LIMIT_EXCEEDED:'Vượt quá 20 ứng viên',
  PROVIDER_AUTH_FAILED:'Tài khoản gửi mail chưa sẵn sàng',PROVIDER_RATE_LIMITED:'Nhà cung cấp đang giới hạn gửi',PROVIDER_REJECTED:'Email bị từ chối',
  PROVIDER_UNAVAILABLE:'Dịch vụ gửi mail tạm thời không khả dụng',UNKNOWN_SEND_ERROR:'Không thể gửi email'
};
function mailErrorText(code,message=''){return mailErrorLabels[code]||message||code||'Không đủ điều kiện gửi'}
function mailRequestPayload(){
  return {candidate_ids:[...mailSelectedIds],company_name:document.querySelector('#mail-company').value.trim(),job_paragraph:document.querySelector('#mail-job-paragraph').value.trim()||null};
}
function validateMailAttachments(){
  const files=[...document.querySelector('#mail-attachments').files];
  if(files.length>3)return 'Chỉ được đính kèm tối đa 3 file PDF.';
  if(files.some(file=>!/\.pdf$/i.test(file.name)||(file.type&&file.type!=='application/pdf')))return 'Tất cả file đính kèm phải là PDF.';
  if(files.some(file=>file.size>5*1024*1024))return 'Mỗi file PDF không được vượt quá 5 MB.';
  if(files.reduce((sum,file)=>sum+file.size,0)>10*1024*1024)return 'Tổng dung lượng file không được vượt quá 10 MB.';
  return '';
}
function renderMailAttachments(){
  const files=[...document.querySelector('#mail-attachments').files],list=document.querySelector('#mail-attachment-list');
  list.replaceChildren(...files.map(file=>{const item=document.createElement('li');item.textContent=`${file.name} (${(file.size/1024/1024).toFixed(1)} MB)`;return item}));
}
function markMailPreviewStale(){
  mailPreviewStale=true;mailLastResult=null;
  if(mailPreviewItems.length)document.querySelector('#mail-validation').textContent='Nội dung đã thay đổi. Hãy tạo lại bản xem trước.';
  refreshMailSendState();
}
function refreshMailSendState(){
  const company=document.querySelector('#mail-company').value.trim(),attachmentError=validateMailAttachments();
  const allReady=mailPreviewItems.length===mailSelectedIds.length&&selectedEligibleCount(mailPreviewItems)===mailPreviewItems.length;
  document.querySelector('#mail-send').disabled=mailSending||mailPreviewStale||!company||Boolean(attachmentError)||!allReady||Boolean(mailLastResult);
  document.querySelector('#mail-preview').disabled=mailSending||!company||mailSelectedIds.length===0||mailSelectedIds.length>20||Boolean(attachmentError);
  if(mailSelectedIds.length>20)document.querySelector('#mail-validation').textContent='Mỗi đợt chỉ được gửi tối đa 20 ứng viên.';
  else if(attachmentError)document.querySelector('#mail-validation').textContent=attachmentError;
}
function renderMailRecipients(){
  const list=document.querySelector('#mail-recipient-list');
  if(!mailPreviewItems.length){list.innerHTML='<div class="mail-recipient-row"><span>Chưa có bản xem trước.</span></div>';return}
  const rows=mailPreviewItems.map(item=>{
    const ready=item.status==='READY',delivery=mailLastResult?.results?.find(result=>result.candidate_id===item.candidate_id);
    const state=delivery?.status==='SENT'?'Đã gửi':delivery?mailErrorText(delivery.error_code,delivery.error_message):(ready?'Sẵn sàng':mailErrorText(item.error_code));
    const stateClass=delivery?.status==='SENT'||(!delivery&&ready)?'mail-state-ready':'mail-state-blocked';
    return `<button class="mail-recipient-row" type="button" data-mail-candidate="${escapeHtml(item.candidate_id)}" aria-label="Xem email của ${escapeHtml(item.candidate_name)}"><span>${escapeHtml(item.candidate_name||'—')}</span><span>${escapeHtml(item.email||'—')}</span><span>${escapeHtml(item.role_title||'—')}</span><span class="${stateClass}">${escapeHtml(state)}</span></button>`;
  }).join('');
  list.innerHTML=`<div class="mail-recipient-row mail-recipient-head"><span>Tên</span><span>Mail</span><span>Vị trí</span><span>Trạng thái</span></div>${rows}`;
}
function renderCurrentMailPreview(){
  const item=mailPreviewItems[mailPreviewIndex],title=document.querySelector('#mail-preview-title');
  if(!item){title.textContent='Nội dung xem trước';document.querySelector('#mail-preview-subject').textContent='';document.querySelector('#mail-preview-body').textContent='Nhập tên công ty và tạo bản xem trước.';document.querySelector('#mail-preview-previous').disabled=true;document.querySelector('#mail-preview-next').disabled=true;return}
  title.textContent=`${mailPreviewIndex+1}/${mailPreviewItems.length} — ${item.candidate_name||'Ứng viên'}`;
  document.querySelector('#mail-preview-subject').textContent=item.subject||mailErrorText(item.error_code);
  document.querySelector('#mail-preview-body').textContent=item.body_text||'Ứng viên này chưa đủ điều kiện gửi.';
  document.querySelector('#mail-preview-previous').disabled=mailPreviewIndex===0;
  document.querySelector('#mail-preview-next').disabled=mailPreviewIndex>=mailPreviewItems.length-1;
}
function openMailCompose(){
  if(!selectedIds.size)return;
  mailTrigger=document.activeElement;mailSelectedIds=[...selectedIds];mailPreviewItems=[];mailPreviewIndex=0;mailPreviewStale=true;mailSending=false;mailLastResult=null;mailIdempotencyKey=crypto.randomUUID();
  document.querySelector('#mail-company').value='';document.querySelector('#mail-job-paragraph').value='';document.querySelector('#mail-attachments').value='';
  document.querySelector('#mail-dialog-count').textContent=`${mailSelectedIds.length} ứng viên đã chọn`;
  document.querySelector('#mail-validation').textContent=selectedIds.size>20?'Mỗi đợt chỉ được gửi tối đa 20 ứng viên.':'';
  document.querySelector('#mail-result-summary').textContent='';renderMailAttachments();renderMailRecipients();renderCurrentMailPreview();refreshMailSendState();
  document.querySelector('#mail-compose-dialog').showModal();document.querySelector('#mail-company').focus();
}
function closeMailCompose(){
  if(mailSending)return;
  document.querySelector('#mail-compose-dialog').close();mailTrigger?.focus();
}
async function previewMailBatch(){
  const validation=document.querySelector('#mail-validation'),button=document.querySelector('#mail-preview');
  validation.textContent='';button.disabled=true;button.textContent='Đang tạo...';mailLastResult=null;
  try{
    const result=await api('/api/mail/preview',{method:'POST',body:JSON.stringify(mailRequestPayload())});
    mailPreviewItems=Array.isArray(result.items)?result.items:[];mailPreviewIndex=0;mailPreviewStale=false;
    renderMailRecipients();renderCurrentMailPreview();
    const blocked=mailPreviewItems.length-selectedEligibleCount(mailPreviewItems);
    validation.textContent=blocked?`${blocked} ứng viên chưa đủ điều kiện. Hãy kiểm tra danh sách người nhận.`:'';
  }catch(error){mailPreviewItems=[];mailPreviewStale=true;renderMailRecipients();renderCurrentMailPreview();validation.textContent=error.message}
  finally{button.textContent='Tạo bản xem trước';refreshMailSendState()}
}
function confirmMailBatch(){
  if(document.querySelector('#mail-send').disabled)return;
  const count=selectedEligibleCount(mailPreviewItems);document.querySelector('#mail-confirm-text').textContent=`Gửi ${count} email riêng biệt đến ${count} ứng viên?`;
  document.querySelector('#mail-confirm-dialog').showModal();
}
async function sendMailBatch(){
  if(mailSending)return;
  document.querySelector('#mail-confirm-dialog').close();mailSending=true;refreshMailSendState();
  const resultSummary=document.querySelector('#mail-result-summary'),sendButton=document.querySelector('#mail-send');sendButton.textContent='Đang gửi...';resultSummary.textContent='';
  try{
    const form=new FormData(),payload={...mailRequestPayload(),idempotency_key:mailIdempotencyKey};
    form.append('payload',JSON.stringify(payload));for(const file of document.querySelector('#mail-attachments').files)form.append('attachments',file);
    mailLastResult=await api('/api/mail/send',{method:'POST',body:form});
    const summary=summarizeSendResult(mailLastResult);resultSummary.textContent=summary.message;resultSummary.className=`mail-result-summary ${summary.type}`;
    const sentIds=new Set((mailLastResult.results||[]).filter(item=>item.status==='SENT').map(item=>item.candidate_id));
    selectedIds=new Set([...selectedIds].filter(id=>!sentIds.has(id)));renderMailRecipients();render();
  }catch(error){resultSummary.textContent=error.message;resultSummary.className='mail-result-summary error'}
  finally{mailSending=false;sendButton.textContent='Gửi email';refreshMailSendState()}
}

async function uploadFiles(files){
  const pdfs=[...files].filter(file=>/\.pdf$/i.test(file.name));
  if(!pdfs.length){setStatus('Vui lòng chọn file PDF.','error');return}
  const roleSelect=document.querySelector('#upload-role'),roleTitle=selectedRoleTitle();
  if(!roleTitle){
    const isNew=roleSelect.value==='__new__';
    setStatus(isNew?'Vui lòng nhập tên vị trí mới trước khi tải CV.':'Vui lòng chọn phân loại vị trí trước khi tải CV.','error');
    document.querySelector(isNew?'#upload-role-new':'#upload-role').focus();document.querySelector('#files').value='';return;
  }
  let completed=0,failed=0;
  for(const file of pdfs){
    setStatus(`Đang đọc ${completed+failed+1}/${pdfs.length}: ${file.name}`);
    try{const form=new FormData();form.append('file',file);form.append('role_title',roleTitle);await api('/api/import',{method:'POST',body:form});completed++}
    catch(error){failed++;setStatus(`${file.name}: ${error.message}`,'error')}
  }
  await Promise.all([loadCandidates(),loadJobs()]);
  if(completed)syncRoleSelection(roleTitle);
  setStatus(`Hoàn tất ${completed} hồ sơ${failed?`, ${failed} hồ sơ lỗi`:''}.`,failed?'error':'ok');
  document.querySelector('#files').value='';
}

document.querySelector('#files').addEventListener('change',event=>uploadFiles(event.target.files));
document.querySelector('#upload-role').addEventListener('change',()=>{
  const isNew=document.querySelector('#upload-role').value==='__new__',input=document.querySelector('#upload-role-new');
  input.hidden=!isNew;if(isNew)input.focus();else input.value='';
});
document.querySelector('#search').addEventListener('input',()=>{page=1;render()});
document.querySelector('#candidate-list').addEventListener('change',event=>{if(!event.target.classList.contains('row-select'))return;event.target.checked?selectedIds.add(event.target.dataset.id):selectedIds.delete(event.target.dataset.id);updateSelectionUI()});
document.querySelector('#select-all').addEventListener('change',event=>{visibleIds.forEach(id=>event.target.checked?selectedIds.add(id):selectedIds.delete(id));render()});
document.querySelector('#send-selected').addEventListener('click',openMailCompose);
document.querySelector('#delete-selected').addEventListener('click',()=>document.querySelector('#delete-dialog').showModal());
document.querySelector('#delete-no').addEventListener('click',()=>document.querySelector('#delete-dialog').close());
document.querySelector('#delete-yes').addEventListener('click',deleteSelectedCandidates);
document.querySelector('#mail-close').addEventListener('click',closeMailCompose);
document.querySelector('#mail-cancel').addEventListener('click',closeMailCompose);
document.querySelector('#mail-preview').addEventListener('click',previewMailBatch);
document.querySelector('#mail-send').addEventListener('click',confirmMailBatch);
document.querySelector('#mail-confirm-no').addEventListener('click',()=>document.querySelector('#mail-confirm-dialog').close());
document.querySelector('#mail-confirm-yes').addEventListener('click',sendMailBatch);
document.querySelector('#mail-company').addEventListener('input',markMailPreviewStale);
document.querySelector('#mail-job-paragraph').addEventListener('input',markMailPreviewStale);
document.querySelector('#mail-attachments').addEventListener('change',()=>{renderMailAttachments();markMailPreviewStale()});
document.querySelector('#mail-preview-previous').addEventListener('click',()=>{if(mailPreviewIndex>0){mailPreviewIndex--;renderCurrentMailPreview()}});
document.querySelector('#mail-preview-next').addEventListener('click',()=>{if(mailPreviewIndex<mailPreviewItems.length-1){mailPreviewIndex++;renderCurrentMailPreview()}});
document.querySelector('#mail-recipient-list').addEventListener('click',event=>{const row=event.target.closest('[data-mail-candidate]');if(!row)return;const index=mailPreviewItems.findIndex(item=>item.candidate_id===row.dataset.mailCandidate);if(index>=0){mailPreviewIndex=index;renderCurrentMailPreview()}});
document.querySelector('#mail-compose-dialog').addEventListener('cancel',event=>{if(mailSending){event.preventDefault();return}event.preventDefault();closeMailCompose()});
document.querySelector('#mail-confirm-dialog').addEventListener('cancel',event=>{event.preventDefault();document.querySelector('#mail-confirm-dialog').close()});
document.querySelectorAll('.filter-select').forEach(select=>select.addEventListener('change',()=>{page=1;render()}));
document.querySelectorAll('.filter-trigger').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();openFilterMenu(button)}));
document.querySelector('#filter-value-search').addEventListener('input',renderFilterOptions);
document.querySelector('#filter-all').addEventListener('click',()=>{menuSelection=new Set(columnValues(menuKey));renderFilterOptions()});
document.querySelector('#filter-clear').addEventListener('click',()=>{menuSelection.clear();renderFilterOptions()});
document.querySelector('#filter-cancel').addEventListener('click',closeFilterMenu);
document.querySelector('#filter-apply').addEventListener('click',()=>{const values=columnValues(menuKey);if(menuSelection.size===values.length)activeFilters.delete(menuKey);else activeFilters.set(menuKey,new Set(menuSelection));closeFilterMenu();page=1;render()});
document.querySelectorAll('[data-menu-sort]').forEach(button=>button.addEventListener('click',()=>{sortKey=menuKey;sortDirection=Number(button.dataset.menuSort);closeFilterMenu();page=1;render()}));
document.addEventListener('click',event=>{const menu=document.querySelector('#filter-menu');if(!menu.hidden&&!menu.contains(event.target)&&!event.target.closest('.filter-trigger'))closeFilterMenu()});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeFilterMenu()});
window.addEventListener('resize',()=>{fitRomajiNames();closeFilterMenu()});
loadCandidates();
loadJobs();
</script>
