<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard CV</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#17233c;font:15px Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px}.header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.header h1{font-size:28px;margin:0 0 6px}.muted{color:#667085}.upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:#0f7b70;color:#fff;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.button:disabled{opacity:.55;cursor:wait}.file-input{position:absolute;inline-size:1px;block-size:1px;opacity:0}.search{width:280px;max-width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:10px 12px;font:inherit;background:#fff}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px}.status{min-height:20px;margin:10px 2px;color:#667085}.status.error{color:#b42318}.status.ok{color:#067647}.table-wrap{overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:920px}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #eef2f6;vertical-align:middle}th{background:#f8fafc;color:#475467;font-size:13px;white-space:nowrap}.name-col{width:24%;min-width:220px}tbody tr:last-child td{border-bottom:0}.name{font-weight:700}.empty{text-align:center;color:#667085;padding:44px!important}.cv-link{color:#0f7b70;font-weight:700;text-decoration:none}.cv-link:hover{text-decoration:underline}@media(max-width:720px){.header{align-items:flex-start;flex-direction:column}.bar{align-items:flex-start;flex-direction:column}.search{width:100%}}
  </style>
</head>
<body>
<main id="dashboard" class="wrap">
  <header class="header">
    <div><h1>DASHBOARD</h1><div id="count" class="muted">0 hồ sơ</div></div>
    <div class="upload">
      <input id="files" class="file-input" type="file" accept="application/pdf,.pdf" multiple>
      <label for="files" class="button">＋ Thêm CV</label>
    </div>
  </header>

  <section class="bar">
    <input id="search" class="search" placeholder="Tìm theo tên, SĐT hoặc email">
    <span class="muted">Chỉ nhận hồ sơ PDF, tối đa 15 MB/file.</span>
  </section>
  <p id="status" class="status"></p>

  <div class="table-wrap">
    <table>
      <thead><tr><th class="name-col">Tên</th><th>Tuổi</th><th>SĐT</th><th>Mail</th><th>Visa hiện tại</th><th>Tiếng Nhật</th><th>Hồ sơ</th></tr></thead>
      <tbody id="candidate-list"><tr><td colspan="7" class="empty">Chưa có hồ sơ.</td></tr></tbody>
    </table>
  </div>
</main>

<script>
let candidates=[];

function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
function setStatus(message,type=''){const element=document.querySelector('#status');element.textContent=message;element.className='status '+type}

async function api(path,options={}){
  const headers={...(options.headers||{})};
  if(options.body&&!(options.body instanceof FormData))headers['Content-Type']='application/json';
  const response=await fetch(path,{...options,headers,credentials:'same-origin'});
  const contentType=response.headers.get('content-type')||'';
  const result=contentType.includes('application/json')?await response.json():await response.text();
  if(response.status===401)throw new Error('Phiên Cloudflare Access không hợp lệ. Hãy tải lại trang để đăng nhập.')
  if(!response.ok){
    if(typeof result==='string'&&result.trim().startsWith('<')&&['127.0.0.1','localhost'].includes(location.hostname)){
      const error=new Error('');error.silent=true;throw error;
    }
    throw new Error(typeof result==='string'?result:(result.error||'Không thể thực hiện thao tác.'));
  }
  return result;
}

async function loadCandidates(){
  try{candidates=await api('/api/candidates');setStatus('');render()}
  catch(error){setStatus(error.silent?'':error.message,error.silent?'':'error')}
}

function render(){
  const query=document.querySelector('#search').value.trim().toLowerCase();
  const visible=candidates.filter(item=>`${item.full_name||''} ${item.phone||''} ${item.email||''}`.toLowerCase().includes(query));
  document.querySelector('#count').textContent=`${visible.length}/${candidates.length} hồ sơ`;
  document.querySelector('#candidate-list').innerHTML=visible.length?visible.map(item=>`<tr><td class="name">${escapeHtml(item.full_name||'—')}</td><td>${escapeHtml(item.age??'—')}</td><td>${escapeHtml(item.phone||'—')}</td><td>${escapeHtml(item.email||'—')}</td><td>${escapeHtml(item.current_visa||'—')}</td><td>${escapeHtml(item.japanese_level||'—')}</td><td>${item.file_name?`<a class="cv-link" href="/api/cv?id=${encodeURIComponent(item.id)}" target="_blank" rel="noopener">Mở PDF</a>`:'—'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">Không có hồ sơ phù hợp.</td></tr>';
}

async function uploadFiles(files){
  const pdfs=[...files].filter(file=>/\.pdf$/i.test(file.name));
  if(!pdfs.length){setStatus('Vui lòng chọn file PDF.','error');return}
  let completed=0,failed=0;
  for(const file of pdfs){
    setStatus(`Đang đọc ${completed+failed+1}/${pdfs.length}: ${file.name}`);
    try{const form=new FormData();form.append('file',file);await api('/api/import',{method:'POST',body:form});completed++}
    catch(error){failed++;setStatus(`${file.name}: ${error.message}`,'error')}
  }
  await loadCandidates();
  setStatus(`Hoàn tất ${completed} hồ sơ${failed?`, ${failed} hồ sơ lỗi`:''}.`,failed?'error':'ok');
  document.querySelector('#files').value='';
}

document.querySelector('#files').addEventListener('change',event=>uploadFiles(event.target.files));
document.querySelector('#search').addEventListener('input',render);
loadCandidates();
</script>
</body>
</html>
